# thoughtbot.com — ground truth
#
# Scaffolded from the frozen artifact. Every TODO below is rejected by
# `make ground-truth-validate` until you replace it.
#
# Read docs/ground-truth.md §2 before filling this in. The rule that
# matters most: write the reference answers from the CRAWLED text, not
# from the live site. An answer written from something the crawler
# never fetched is an ingestion test wearing a retrieval test's label.

prospect:
  company_name: thoughtbot.com
  domain: thoughtbot.com
  crawled_at: "2026-09-09T21:04:38+00:00"
  corpus_artifact: prospect_thoughtbot_com.json
  author: bru678nein
  written_at: "2026-09-03"

# Hand-check these against the LIVE site and replace each TODO.
# The values the crawler reported are shown beside each one: they are
# the claim under test, not the answer. Count the people yourself; open
# every page it called a job posting and decide if it is a vacancy.
signals:
  has_team_page: true
  people_listed: 53
  open_roles_seen: 0
  technical_roles_open: 0
  latest_post_date: "2026-09-09"
  notes: >
    people_listed re-counted by hand on the live https://thoughtbot.com/team
    on 2026-09-10: 53 person cards. It agrees with the crawler's 53 on the
    2026-09-09 crawl. It was 54 on 2026-09-03, by hand and by the crawler, so
    both counts moved together: one fewer person is listed, which is the site
    changing, not a counting defect.

    Note what this field is: how many people the PAGE lists, not how many the
    company employs. They match here; they will not always.

    /people is the one path thoughtbot's robots.txt disallows, so /team is the
    page to check.

    open_roles_seen and technical_roles_open checked on the live
    https://thoughtbot.com/jobs on 2026-09-03. The page states it outright:
    "Our Open Positions / We currently have no open positions." Zero, and so
    zero technical ones. This is the signal the crawler once reported as 4
    roles / 3 technical, by counting pages classified job_posting instead of
    role identities. Re-checked on the live site on 2026-09-10: still no open
    positions, agreeing with the 2026-09-09 crawl.

    latest_post_date re-checked on the live blog on 2026-09-10: the newest post
    is dated 2026-09-09, agreeing with the crawler. It was 2026-09-02 on the
    earlier crawl; a new post went up in between. A date equal to the crawl
    date is exactly the shape of a bad one, which is why it was checked by hand
    both times. Since ADR-0021 the crawler records only dates a page declares,
    and here it is right.

questions:
  - id: q1_what_and_to_whom
    question: What does this company do, and who does it sell to?
    reference: >
      thoughtbot works with companies through every step of identifying and
      solving a problem: it runs product design sprints, builds apps, and
      deploys them. It sells to healthcare, financial and insurance companies.
    source_urls:
      - https://thoughtbot.com/about
      - https://thoughtbot.com/jobs
      - https://thoughtbot.com/services/mvp-development
    must_not_claim:
      - That thoughtbot is itself a healthcare or financial company. The
        "Healthcare + Financial" on /jobs is a list of employee benefits.

  - id: q2_technical_capacity
    question: What evidence is there of in-house technical capacity?
    reference: >
      thoughtbot's team page lists 34 people in development roles: 22 Senior
      Developers, 8 Development Team Leads, 2 Development Directors, 1
      Director of Development Operations, and 1 Developer and CEO.
    source_urls:
      - https://thoughtbot.com/team
    must_not_claim:
      - That thoughtbot has small or no in-house technical capacity.
      - That it lists 37 technical job titles. technical_roles_named = 37
        counts the word "developer" on /team (23) and in the text of two
        playbook pages (14); it is not a count of titles.
    notes: >
      Counted from /team on the 2026-09-09 crawl: 53 titles. Development only,
      decided 2026-09-11: design (8), product management (5), the Internal
      Tools Specialist and 5 non-technical roles are excluded, because
      development is the one group every reader would call technical capacity.

  - id: q3_growth_signals
    question: What signals are there that they are investing or growing?
    reference: >
      Insufficient evidence. The careers page says there are no open
      positions, and no page mentions funding.
    source_urls: []
    expected_outcome: insufficient_evidence
    must_not_claim:
      - That thoughtbot is investing in growth because its playbook talks
        about growth. Those passages are about individual employees' careers.
      - That thoughtbot is expanding. The pages that say "expanding" describe
        clients' projects, not thoughtbot.

  - id: q4_stated_need
    question: What need or priority do they state explicitly?
    reference: >
      Insufficient evidence. No crawled page states something thoughtbot
      needs or cannot yet do: the careers page has no open positions, and its
      stated commitments, such as its DEI work, are things it already does.
    source_urls: []
    expected_outcome: insufficient_evidence
    must_not_claim:
      - That thoughtbot needs to hire. The careers page says there are no
        open positions.
      - That its DEI work is a need. It is a commitment it already acts on.
      - That a problem it solves for clients is its own need. That is q1
        evidence.

