  - id: q1_what_and_to_whom
    question: What does this company do, and who does it sell to?
    reference: >
      fly.io sells virtual machines for running servers and AI agents. It also
      offers private networking, autoscaling and monitoring. These services are
      aimed at clients who want to run their projects in the cloud.
    source_urls:
      - https://fly.io/
      - https://fly.io/docs/networking/services
      - https://fly.io/docs/about/cost-management
