      - That fly.io sells to a single industry. /docs/about/healthcare is about
        customers running HIPAA apps, not a sign fly.io is a healthcare company.
      - That coding agents are what fly.io mainly sells. It built one,
        Phoenix.new, but its product is the machines agents run on.
      - That fly.io is partnered with Anthropic. Sprites come with Claude Code
        pre-installed; no page states a partnership.
