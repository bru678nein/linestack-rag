name: CI

# What runs here, and what deliberately does not.
#
# Runs on every push: lint, unit tests, migration apply against a real
# Postgres with pgvector, structural validation of the ground-truth set.
# All of it is deterministic and free.
#
# Does NOT run on every push: the evaluation harness. It costs API calls and
# its LLM-judged metrics vary run to run, which would produce flaky builds and
# train everyone to ignore red. It is a separate, manually triggered job
# (docs/evaluation.md section 6).
#
# Every job runs the SAME make targets a developer runs locally. The first
# version of this file called `uv pip install --system`, `ruff` and `pytest`
# directly, which failed on the runner -- uv refuses to install into a Python
# it manages itself ("the interpreter ... is externally managed", PEP 668) --
# and, more importantly, meant CI was exercising different commands from the
# ones anyone actually types. A green CI that runs something else is not
# evidence about the thing you run.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make install
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make install
      - name: Unit tests
        run: make test

  migrate:
    # The migration is the only place A1 is enforced by the database
    # (docs/architecture.md section 4.1). If it does not apply cleanly, that
    # guarantee does not exist, so this runs on every push.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: linestack
          POSTGRES_PASSWORD: linestack
          POSTGRES_DB: linestack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linestack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: linestack
      # Both, deliberately. The async engine reads DATABASE_URL and the
      # isolation test reads DATABASE_URL_SYNC; setting only one leaves the
      # other pointing at a default, and the tests then connect somewhere else
      # without saying so. That has already happened on a developer machine.
      DATABASE_URL: postgresql+asyncpg://linestack:linestack@localhost:5432/linestack
      DATABASE_URL_SYNC: postgresql://linestack:linestack@localhost:5432/linestack
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make install
      - name: Apply migrations
        # Not `make migrate`: that target runs psql inside the compose
        # container, and here Postgres is a service container reached over the
        # port. The database is fresh every run, so applying every file in
        # order is correct -- there is nothing to skip.
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Every migration is recorded
        run: psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -c "SELECT version FROM schema_migrations ORDER BY version"
      - name: Schema, isolation and loader tests
        run: make test-integration

  ground-truth:
    # Structural validation only: required fields, resolvable prospect
    # references, well-formed source URLs. No model calls, no cost. A malformed
    # dataset should not reach the harness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make install
      - name: Validate the ground-truth set
        # The same target a developer runs. It handles the empty case itself:
        # the set is written by hand over hours, and a build that goes red on
        # the first day is a build everyone learns to ignore.
        run: make ground-truth-validate

  evaluation:
    # Manual only, and currently a no-op. Enable the body once the harness and
    # the ground-truth set exist. A3: every retrieval change records a
    # before-and-after, and this is where that record is produced.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Not yet implemented
        run: |
          echo "The evaluation harness does not exist yet."
          echo "Design: docs/evaluation.md. Dataset: docs/ground-truth.md."
          echo "Ground-truth authoring is unblocked; the harness is the gap."
